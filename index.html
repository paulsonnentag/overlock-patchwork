<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>overlock patchwork</title>
    <!--
      Optional. If set, scripts loaded from documents that are direct
      children of this folder doc get a friendly DevTools sourceURL of
      the form `packages/<child-name>/<file>` instead of the raw
      automerge URL. The URL comes from `packages/.pushwork/snapshot.json`
      (`rootFolderUrl`); pushwork preserves it across pushes.
    -->
    <meta name="overlock-packages-root" content="automerge:mExaJTQKBs6CHpzZtZYYzc2YDXr">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧶</text></svg>">
    <style>
      html, body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <script src="./dist/patchwork.js"></script>

    <!--
      After running `pnpm push packages`, copy `rootDirectoryUrl` from
      `packages/app-frame/.pushwork/snapshot.json` into the `src` below
      and re-run `pnpm push packages`. The URL stays stable across
      subsequent pushes because pushwork preserves the package's
      `rootDirectoryUrl`. The path component (`/app-frame.json`) is the
      package's manifest filename — by convention named after the
      package, not `component.json`, so the URL self-describes.

      `<app-frame>` is the demo's entry point: it find-or-creates an
      account doc and renders `<app-root>` inside it, which in turn
      composes the rest of the views (`folder-list`, `doc-title`,
      `markdown-editor`, etc.). `<app-root>` requires an account
      ancestor, so it can't be bootstrapped directly — wire `app-frame`
      here.
    -->
    <automerge-repo>
      <patchwork-view src="automerge:36YizWjLr5TWC2deWD8n6uU7g3er/app-frame.json"/>
    </automerge-repo>
  </body>
</html>
